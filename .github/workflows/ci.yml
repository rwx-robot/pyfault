name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install starlette uvicorn pydantic python-multipart graphql-core sqlalchemy alembic pyyaml psutil numpy

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Syntax check (compileall)
        run: python -m compileall -q pyfault

      - name: Import smoke test
        run: |
          python -c "import pyfault.core"
          python -c "import pyfault.common"
          python -c "import pyfault.platform"
          python -c "import pyfault.ai"
          python -c "import pyfault.edge"
          python -c "import pyfault.enterprise"
          python -c "import pyfault.monitoring"
          python -c "import pyfault.benchmark"
          python -c "import pyfault.docs"
